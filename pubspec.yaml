name: sleepable_ai
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  #####  FLUTTER CORE & LOCALIZATION
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  #####  UI / ANIMATION / THEME
  google_fonts: ^6.3.1
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  animated_bottom_navigation_bar: ^1.4.0
  visibility_detector: ^0.4.0+2
  giffy_dialog: ^2.3.0
  nb_utils: 7.1.2
  screen_brightness: ^2.1.7

  #####  STATE MANAGEMENT
  get: ^4.7.2

  #####  CHARTS, GAUGES & SLIDERS
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^31.2.15
  syncfusion_flutter_gauges: ^31.2.18
  sleek_circular_slider: ^2.1.0
  sleep_stages_chart: ^1.0.0
  spinning_wheel: ^0.0.7

  #####  MEDIA (AUDIO & VIDEO)
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  video_player: ^2.10.1
  youtube_player_flutter: ^9.1.3
  wav: ^1.5.0
  audio_service: ^0.18.18
#  audioplayers: ^6.6.0


  #####  DEVICE SENSORS & HARDWARE
  noise_meter: ^5.0.2
  record: ^6.1.2
  torch_light: ^1.1.0
  camera: ^0.10.6
  heart_bpm: ^2.0.0+0
  image_picker: ^1.2.0
  wakelock_plus: ^1.4.0
  haptic_feedback: ^0.6.4+3
  sensors_plus: ^7.0.0

  #####  SYSTEM & STORAGE
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  permission_handler: ^11.3.1
  flutter_foreground_task: ^9.2.1
  media_store_plus: ^0.1.3
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1

  #####  FIREBASE & AUTHENTICATION
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth: ^7.1.5
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0

  #####  UTILITIES & SOCIAL
  intl: ^0.20.2
  http: ^1.5.0
  html: ^0.15.5
  share_plus: 11.1.0
  flutter_timezone: ^5.0.2
  battery_plus: ^7.0.0

  #####  PAYMENT (MONETIZATION)
#  in_app_purchase: ^3.2.3
#  in_app_purchase_android: ^0.4.0+8
  purchases_flutter: ^9.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

dependency_overrides:
  audio_streamer: 4.2.0
  package_info_plus: 8.1.1

flutter:
  uses-material-design: true

  fonts:
    - family: InterTight
      fonts:
        - asset: assets/font/InterTight-Regular.ttf
          weight: 400
        - asset: assets/font/InterTight-Bold.ttf
          weight: 700
    - family: Coolvetica
      fonts:
        - asset: assets/font/Coolvetica-Rg.otf

  assets:
    - assets/
    - assets/audio/
    - assets/video/
    - assets/audio/music/
    - assets/font/
    - assets/icons/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/alarm/
    - assets/images/home/
    - assets/images/onboarding/positions/
    - assets/images/music/
    - assets/images/lottie/
    - assets/images/sleeppedia/
    - assets/audio/music/morning-birds-music.mp3
    - assets/images/onboarding/boot_up_final.mp4
