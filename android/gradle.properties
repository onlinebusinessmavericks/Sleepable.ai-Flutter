#org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
#android.useAndroidX=true
#android.enableJetifier=true
org.gradle.jvmargs=-Xmx6G --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Jetifier is unnecessary with modern AndroidX and can rewrite kotlin-stdlib jars.
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=34
kotlin.jvm.target.validation.mode=IGNORE
# Align Kotlin metadata/compiler with Firebase Auth / audio_session (2.3.x)
kotlin.version=2.3.10
# Enable 16KB page size support
android.enableR8.fullMode=true
android.ndk.suppressMinSdkVersionError=21
