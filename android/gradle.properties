#org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
#android.useAndroidX=true
#android.enableJetifier=true
org.gradle.jvmargs=-Xmx6G --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Jetifier is unnecessary with modern AndroidX and can rewrite kotlin-stdlib jars.
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=36
kotlin.jvm.target.validation.mode=IGNORE
# Align Kotlin metadata/compiler with Firebase Auth / audio_session
kotlin.version=2.4.0
# Enable 16KB page size support
android.enableR8.fullMode=true
android.ndk.suppressMinSdkVersionError=21
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Allow plugins that still reference the legacy ProGuard defaults (removed in AGP 9)
android.r8.proguardAndroidTxt.disallowed=false
